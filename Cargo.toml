[workspace]
members = [
    "examples/hello-widget",
    "providers/warframe-worldstate",
    "sdk/rust/overcrow-widget-sdk",
    "tools/marketplace-tool",
    "widgets/warframe-data",
    "widgets/warframe-fissures",
    "widgets/warframe-invasions",
    "widgets/warframe-sortie-archon",
    "widgets/warframe-status",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.98"

[workspace.dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["alloc", "now", "std"] }
crc32fast = "=1.5.0"
dlmalloc = { version = "=0.2.14", default-features = false, features = ["global"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
rlibc = "=1.0.0"
spin = { version = "=0.12.3", default-features = false, features = ["mutex", "spin_mutex"] }
wit-bindgen = { version = "=0.53.1", default-features = false, features = ["macros", "realloc"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
url = "=2.5.8"
wasmparser = { version = "=0.245.1", default-features = false, features = ["component-model", "std"] }
wit-component = "=0.245.1"
wit-parser = { version = "=0.245.1", features = ["decoding"] }
