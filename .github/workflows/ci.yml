name: marketplace-ci

on:
  pull_request_target:
  push:
    branches: [master, candidate]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned admission toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 wasm32-wasip2
          rustup default 1.98.0
      - name: Admit through the reviewed base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          PUSH_REF: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request_target)
              CI_EVENT=pull_request
              TRUST_SHA=$BASE_SHA
              REVIEW_SHA=$HEAD_SHA
              ;;
            push)
              CI_EVENT=push
              TRUST_SHA=$PUSH_SHA
              REVIEW_SHA=$PUSH_SHA
              BASE_REF=$PUSH_REF
              HEAD_REF=$PUSH_REF
              HEAD_REPOSITORY=$REPOSITORY
              ;;
            *)
              printf '%s\n' 'error: CI event metadata is missing' >&2
              exit 1
              ;;
          esac
          for revision in "$TRUST_SHA" "$REVIEW_SHA"; do
            if test "${#revision}" -ne 40; then
              printf '%s\n' 'error: CI commit metadata is missing' >&2
              exit 1
            fi
            case "$revision" in
              *[!0-9a-f]*)
                printf '%s\n' 'error: CI commit metadata is malformed' >&2
                exit 1
                ;;
            esac
          done
          ci_git() {
            /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
              /usr/bin/timeout --signal=TERM --kill-after=5 60 \
              /usr/bin/prlimit --cpu=30 --as=1073741824 --nofile=128 \
                --fsize=67108864 -- \
              /usr/bin/git --no-replace-objects \
                -c core.fsmonitor=false -c core.hooksPath=/dev/null \
                -c core.attributesFile=/dev/null -c core.excludesFile=/dev/null \
                -c credential.helper= -c protocol.file.allow=never \
                -c protocol.ext.allow=never -C "$PWD" "$@"
          }
          if test "$CI_EVENT" = pull_request; then
            case "$PR_NUMBER" in
              ''|*[!0-9]*)
                printf '%s\n' 'error: pull-request metadata is malformed' >&2
                exit 1
                ;;
            esac
            if test "${#PR_NUMBER}" -gt 20; then
              printf '%s\n' 'error: pull-request metadata is malformed' >&2
              exit 1
            fi
            ci_git fetch --no-tags --no-write-fetch-head --force --depth=1 \
              https://github.com/Valhallab/playervox-overcrow-marketplace.git \
              "refs/pull/$PR_NUMBER/head:refs/overcrow-review/$REVIEW_SHA"
            fetched_revision=$(ci_git rev-parse --verify \
              "refs/overcrow-review/$REVIEW_SHA^{commit}" 2>/dev/null) \
              || fetched_revision=''
            if test "$fetched_revision" != "$REVIEW_SHA"; then
              printf '%s\n' 'error: pull-request revision is unavailable' >&2
              exit 1
            fi
          fi
          private_root=$(/usr/bin/mktemp -d "${RUNNER_TEMP:?}/marketplace-ci.XXXXXXXXXX")
          cleanup() {
            /usr/bin/rm -rf -- "$private_root"
          }
          trap cleanup EXIT HUP INT TERM
          bootstrap="$private_root/materialize-git-snapshot.sh"
          ci_git show "$TRUST_SHA:scripts/materialize-git-snapshot.sh" >"$bootstrap"
          /usr/bin/chmod 0700 "$bootstrap"
          trusted_root="$private_root/trusted"
          sh "$bootstrap" --bootstrap "$PWD" "$TRUST_SHA" "$trusted_root"
          # A fresh runner has no Cargo registry cache. Populate it only from
          # the reviewed snapshot; all candidate-facing builds remain offline.
          (
            CDPATH='' cd -- "$trusted_root"
            /usr/bin/timeout --signal=TERM --kill-after=5 300 \
              cargo fetch --locked \
                --manifest-path tools/marketplace-tool/Cargo.toml
          )
          if test ! -f "$trusted_root/scripts/ci-verify.sh" \
              || test -L "$trusted_root/scripts/ci-verify.sh"; then
            printf '%s\n' 'error: reviewed CI driver is unavailable' >&2
            exit 1
          fi
          sh "$trusted_root/scripts/ci-verify.sh" \
            "$PWD" "$TRUST_SHA" "$REVIEW_SHA" "$CI_EVENT" \
            "$REPOSITORY" "$BASE_REF" "$HEAD_REPOSITORY" "$HEAD_REF" \
            "$private_root" admission
